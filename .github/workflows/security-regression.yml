name: NPC security regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '50 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR secret isolation and pinned deploy
        run: node .github/scripts/ci-guard.mjs
