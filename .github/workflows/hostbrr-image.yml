name: Build NPC AI Sim HostBrr image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "server.ts"
      - "scripts/**"
      - "index.html"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/hostbrr-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: npc-hostbrr-image-main
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate application build and cognition
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build and verify cognition
        run: |
          npm run build
          npm run verify:cognition
      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/ai-wonderland1/npc-ai-sim:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AI-WonderLand1/NPC-AI-SIM
            org.opencontainers.image.revision=${{ github.sha }}
