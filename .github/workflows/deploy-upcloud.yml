name: Deploy NPC AI Sim to UpCloud VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npc-upcloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Secret-free NPC build and cognition checks
    runs-on: ubuntu-latest
    # No production credentials in the scope of contributor-controlled npm scripts.
    steps:
      - uses: actions/checkout@v7
      - name: Check memory sidecar syntax
        run: python3 -m py_compile memory_service/app.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:cognition

  deploy:
    name: Deploy exact tested NPC commit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      UPCLOUD_SERVER_IP: ${{ vars.NPC_UPCLOUD_SERVER_IP || vars.UPCLOUD_SERVER_IP || secrets.UPCLOUD_HOST }}
      UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || secrets.UPCLOUD_USER || 'root' }}
      SSH_PRIVATE_KEY: ${{ secrets.UPLOAD_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.UPCLOUD_SSH_KEY }}
      NPC_PUBLIC_URL: ${{ vars.NPC_PUBLIC_URL }}
    steps:
      - name: Validate configured dedicated NPC host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPCLOUD_SERVER_IP" || { echo 'Set NPC_UPCLOUD_SERVER_IP (dedicated NPC host); no unsafe hardcoded default'; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing UpCloud SSH key'; exit 1; }
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy and restart NPC AI Sim
        shell: bash
        run: |
          set -euo pipefail
          ssh "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" "EXPECTED_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
            set -euo pipefail
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid expected commit'; exit 1; }
            APP_DIR=/opt/NPC-AI-SIM
            for command in git node npm; do command -v "$command" >/dev/null || { echo "Missing $command"; exit 1; }; done
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch origin main
            else
              rm -rf "$APP_DIR"
              git clone --branch main https://github.com/AI-WonderLand1/NPC-AI-SIM.git "$APP_DIR"
            fi
            git -C "$APP_DIR" cat-file -e "$EXPECTED_SHA^{commit}" || { echo 'Expected commit missing on NPC host'; exit 1; }
            git -C "$APP_DIR" reset --hard "$EXPECTED_SHA"
            cd "$APP_DIR"
            if [ ! -f .env ]; then echo '::warning::No NPC server-side .env; BYOK or provider features may be unavailable'; fi
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            npm run build
            npm run verify:cognition
            printf '%s\n' '[Unit]' 'Description=NPC AI Sim' 'After=network-online.target' 'Wants=network-online.target' '' '[Service]' 'Type=simple' 'WorkingDirectory=/opt/NPC-AI-SIM' 'Environment=NODE_ENV=production' 'Environment=PORT=3000' 'EnvironmentFile=-/opt/NPC-AI-SIM/.env' 'ExecStart=/usr/bin/env npm start' 'Restart=always' 'RestartSec=5' '' '[Install]' 'WantedBy=multi-user.target' > /etc/systemd/system/npc-ai-sim.service
            systemctl daemon-reload
            systemctl enable npc-ai-sim.service >/dev/null
            systemctl restart npc-ai-sim.service
            healthy=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then healthy=1; break; fi
              sleep 3
            done
            test "$healthy" -eq 1 || { echo 'NPC process failed localhost health check'; exit 1; }
            echo "NPC commit $EXPECTED_SHA healthy on localhost"
          REMOTE
      - name: Verify public NPC URL when configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NPC_PUBLIC_URL" ]; then echo '::warning::NPC_PUBLIC_URL missing; cannot verify external ingress/TLS'; exit 0; fi
          case "$NPC_PUBLIC_URL" in https://*) ;; *) echo 'NPC_PUBLIC_URL must use https'; exit 1;; esac
          curl -fsS --max-time 15 "${NPC_PUBLIC_URL%/}/api/health" >/dev/null
          echo 'Public NPC health passed.'
