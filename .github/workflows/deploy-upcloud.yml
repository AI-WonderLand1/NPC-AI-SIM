name: Verify NPC AI Sim for Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Secret-free NPC build and cognition checks
    runs-on: ubuntu-latest
    name: Verify NPC AI Sim build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify memory sidecar syntax
        run: python3 -m py_compile memory_service/app.py
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build client and server
        run: npm run build
      - name: Verify cognition runtime
        run: npm run verify:cognition
      - name: Verify Railway container build
        run: docker build --tag npc-ai-sim:ci .
